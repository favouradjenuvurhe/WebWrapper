name: Android Build

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Permission
        run: chmod +x gradlew
        working-directory: ./androidApp

      - name: Build APK
        run: ./gradlew assembleRelease
        working-directory: ./androidApp

      - name: Build AAB
        run: ./gradlew bundleRelease
        working-directory: ./androidApp
